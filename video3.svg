<svg xmlns="http://www.w3.org/2000/svg" width="560" height="315" viewBox="0 0 560 315" fill="none">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Card with rounded corners -->
  <rect width="560" height="315" rx="20" fill="url(#bg3)" />
  <rect x="1" y="1" width="558" height="313" rx="19" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5" fill="none" />

  <!-- Ambient Glow -->
  <circle cx="460" cy="70" r="130" fill="#0EA5E9" fill-opacity="0.2" />
  <circle cx="100" cy="250" r="100" fill="#6366F1" fill-opacity="0.12" />

  <!-- Category Tag -->
  <rect x="36" y="36" width="150" height="28" rx="14" fill="#0284C7" fill-opacity="0.25" stroke="#0284C7" stroke-opacity="0.4" />
  <text x="111" y="54" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">WEB DEVELOPMENT</text>

  <!-- Play Button -->
  <g transform="translate(280, 138)">
    <circle cx="0" cy="0" r="32" fill="#FF0000" filter="url(#shadow3)" />
    <polygon points="-6,-12 -6,12 12,0" fill="#FFFFFF" />
  </g>

  <!-- Video Details -->
  <text x="36" y="240" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Full Stack Web Development</text>
  <text x="36" y="270" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500">▶ Watch Tutorial on YouTube • React &amp; Node</text>
</svg>
